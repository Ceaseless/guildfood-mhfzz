<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guild Food Recipes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <main>
    <div class="head">
      <h1 data-i18n="title">Guild Food Recipes</h1>
    </div>
    <div class="bar">        
        <select id="meal"></select> 
        <button type="button" id="lang" data-i18n="toggle" aria-pressed="false">JP</button>
    </div>

    <p id="status" role="status"></p>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="base" class="base">Base ingredient</th>
            <th data-i18n="aux1">Auxiliary 1</th>
            <th data-i18n="aux2">Auxiliary 2</th>
            <th data-i18n="aux3">Auxiliary 3</th>
            <th class="num" data-i18n="finalDiff">Difficulty</th>
            <th data-i18n="greatFail">Great Failure</th>
            <th data-i18n="fail">Failure</th>
            <th data-i18n="succ">Success</th>
            <th data-i18n="greatSucc">Great Success</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script src="data/data.js"></script>
  <script src="scripts/app.js"></script>
</body>

</html>
